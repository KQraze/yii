version: '3.8'

services:
  web:
    build: .
    container_name: yii-web
    volumes:
      - .:/var/www/html
    expose:
      - "9000"
    depends_on:
      - db
    environment:
      - TZ=Europe/Moscow
    networks:
      - yii-net

  nginx:
    image: nginx:alpine
    container_name: yii-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - yii-net

  db:
    image: mysql:8.0
    container_name: yii-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii
      MYSQL_USER: yii
      MYSQL_PASSWORD: yii
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - yii-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: yii-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db
    networks:
      - yii-net

volumes:
  db_data:

networks:
  yii-net:
    driver: bridge
